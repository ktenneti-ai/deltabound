[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltabound"
version = "0.1.0"
description = "Understand, plan and validate legacy ETL migrations (SAP Data Services first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
authors = [{ name = "Kishore Tenneti" }]
dependencies = ["pydantic>=2.5", "networkx>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
explain = ["anthropic>=2.6"]
# Runs generated notebooks in tests (Python 3.11+, needs Java).
spark = ["pyspark>=4.1", "delta-spark>=4.4"]

[project.scripts]
deltabound = "deltabound.cli:main"

[tool.setuptools.packages.find]
include = ["deltabound*"]

[tool.pytest.ini_options]
markers = ["spark: runs generated notebooks on local Spark (needs the spark extra and Java; slow)"]
